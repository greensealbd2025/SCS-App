<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SCS SUIT</title>
<meta name="description" content="SCS SUIT — Swarup Construction Solution-এর সব অ্যাপ এক জায়গায়">
<meta name="theme-color" content="#db2777">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCS SUIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bar:#db2777;--bar2:#be185d;--ink:#0f172a;--mute:#64748b;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--bh:34px}
  @media (prefers-color-scheme:dark){:root{--ink:#e2e8f0;--mute:#94a3b8;--bg:#0b1220;--card:#111a2e;--line:#1e293b}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* টেনে নামালে রিফ্রেশ বন্ধ */
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
  /* হোম পেজের সরু বার (অ্যাপ খুললে লুকিয়ে যায়) */
  #bar{position:fixed;left:0;right:0;top:0;z-index:20;height:calc(var(--bh) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));background:var(--bar);color:#fff;display:flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
  #bar .ttl{flex:1;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;letter-spacing:.04em;min-width:0}
  #bar .ttl img{height:22px;width:22px;object-fit:contain;background:#fff;border-radius:6px;padding:1px}
  .ib{flex:none;width:28px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .ib:active{transform:scale(.94)}.ib:hover{background:rgba(255,255,255,.26)}
  .ib svg{width:15px;height:15px}
  .spin svg{animation:r .7s linear infinite}
  .hide{display:none!important}
  /* হোম: শুধু অ্যাপের নাম ও লোগো */
  #home{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bh) + env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px max(10px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  #grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px 10px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}
  .app:hover{border-color:var(--c,#db2777)}.app:active{transform:scale(.97)}
  .app .lg{width:52px;height:52px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--c,#db2777)}
  .app .lg img{width:44px;height:44px;object-fit:contain}
  .app .nm{font-size:12px;font-weight:800;line-height:1.25}
  /* খোলা অ্যাপ: পুরো স্ক্রিন, কোনো বার নেই */
  #frames{position:fixed;inset:0;background:#fff}
  #frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
  #ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:2}
  #ld img{width:56px;height:56px;object-fit:contain;animation:p 1.1s ease-in-out infinite}
  @keyframes p{50%{opacity:.35;transform:scale(.92)}}
  @keyframes r{to{transform:rotate(360deg)}}
  /* ভাসমান ছোট বোতাম: ফিরে যান + রিফ্রেশ (টেনে সরানো যায়) */
  #pill{position:fixed;z-index:25;top:calc(4px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(219,39,119,.92);box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none}
  #pill .ib{width:26px;height:22px;border-radius:7px}
  #pill .ib svg{width:14px;height:14px}
  #pill .grip{width:8px;cursor:grab;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:10px;line-height:1}
  /* ডেস্কটপে টাইটেল বারের জায়গা ব্যবহার করলে (Window Controls Overlay) */
  @media (display-mode:window-controls-overlay){
    #bar{left:env(titlebar-area-x,0);width:env(titlebar-area-width,100%);top:env(titlebar-area-y,0);height:env(titlebar-area-height,var(--bh));padding:0 8px;-webkit-app-region:drag;app-region:drag}
    #bar .ib,#pill{-webkit-app-region:no-drag;app-region:no-drag}
    #home{top:env(titlebar-area-height,var(--bh))}
    body.inapp #frames{top:env(titlebar-area-height,0)}
    body.inapp #pill{top:calc(env(titlebar-area-height,30px) / 2 - 14px);left:calc(env(titlebar-area-x,0px) + 8px);transform:none}
    body.inapp #wco{display:block}
  }
  #wco{display:none;position:fixed;top:0;left:env(titlebar-area-x,0);width:env(titlebar-area-width,100%);height:env(titlebar-area-height,0);background:var(--bar);-webkit-app-region:drag;app-region:drag;z-index:24}
  #off{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:#fef3c7;color:#92400e;font-size:12px;font-weight:700;padding:6px 12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  #ins,#ios{position:fixed;z-index:30;bottom:calc(12px + env(safe-area-inset-bottom))}
  #ins{right:12px;background:#db2777;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(219,39,119,.35);cursor:pointer}
  #ios{left:12px;right:12px;background:#0f172a;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
  #ios b{color:#f9a8d4}#ios span{float:right;cursor:pointer;font-weight:800;padding-left:10px}
  @media (max-width:420px){#grid{grid-template-columns:repeat(3,1fr);gap:8px}.app .lg{width:46px;height:46px}.app .lg img{width:38px;height:38px}.app .nm{font-size:11px}}
</style>
</head>
<body>
<header id="bar">
  <div class="ttl"><img src="logo.png" alt="">SCS SUIT</div>
  <button class="ib" id="refBtn" title="রিফ্রেশ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>

<main id="home"><div id="grid"></div></main>

<section id="frames" class="hide"><div id="ld" class="hide"><img src="logo.png" alt=""></div></section>
<div id="wco"></div>
<div id="pill" class="hide">
  <span class="grip" id="grip" title="টেনে সরান">⋮</span>
  <button class="ib" id="backBtn" title="সব অ্যাপ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ib" id="ref2Btn" title="রিফ্রেশ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div>
<div id="off" class="hide">ইন্টারনেট নেই — সংযোগ ফিরলে রিফ্রেশ চাপুন</div>
<button id="ins" class="hide">📲 SCS SUIT ইনস্টল করুন</button>
<div id="ios" class="hide"><span id="iosX">✕</span>iPhone / iPad-এ ইনস্টল: নিচের <b>Share</b> (□↑) চাপুন, তারপর <b>Add to Home Screen</b>।</div>

<script src="apps.js"></script>
<script>
(function () {
  'use strict';
  var APPS = (window.SCS_APPS || []).filter(function (a) { return a && a.name && /^https:\/\//.test(a.url || ''); });
  var $ = function (id) { return document.getElementById(id); };
  var KEEP = 4;              /* একসাথে কয়টি অ্যাপ খোলা রাখবে (দ্রুত বদলানোর জন্য) */
  var open = {}, order = [], cur = -1;
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var logoOf = function (a) { return a.logo || 'logo.png'; };

  function drawGrid() {
    var html = '';
    APPS.forEach(function (a, i) {
      html += '<button class="app" data-i="' + i + '" style="--c:' + esc(a.color || '#db2777') + '"><span class="lg"><img src="' + esc(logoOf(a)) + '" alt="" loading="lazy" onerror="this.src=\'logo.png\'"></span><span class="nm">' + esc(a.name) + '</span></button>';
    });
    $('grid').innerHTML = html || '<div class="empty">কোনো অ্যাপ পাওয়া যায়নি</div>';
  }

  function showHome() {
    cur = -1; $('frames').classList.add('hide'); $('home').classList.remove('hide'); $('bar').classList.remove('hide');
    $('pill').classList.add('hide'); document.body.classList.remove('inapp');
    document.title = 'SCS SUIT';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }

  function loading(on) { $('ld').classList.toggle('hide', !on); }

  function openApp(i) {
    var a = APPS[i]; if (!a) return;
    cur = i; $('home').classList.add('hide'); $('bar').classList.add('hide'); $('frames').classList.remove('hide');
    $('pill').classList.remove('hide'); document.body.classList.add('inapp'); placePill();
    document.title = a.name + ' — SCS SUIT';
    Object.keys(open).forEach(function (k) { open[k].style.visibility = +k === i ? 'visible' : 'hidden'; open[k].style.zIndex = +k === i ? 1 : 0; });
    order = order.filter(function (k) { return k !== i; }); order.push(i);
    if (!open[i]) {
      var f = document.createElement('iframe');
      f.title = a.name; f.allow = 'clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation';
      f.addEventListener('load', function () { if (cur === i) loading(false); });
      f.src = a.url; $('frames').appendChild(f); open[i] = f; loading(true);
      setTimeout(function () { if (cur === i) loading(false); }, 20000);
      while (order.length > KEEP) { var old = order.shift(); if (open[old]) { open[old].remove(); delete open[old]; } }
    } else loading(false);
    try { history.replaceState(null, '', '#' + i); } catch (e) {}
  }

  function refresh() {
    var b = cur < 0 ? $('refBtn') : $('ref2Btn'); b.classList.add('spin'); setTimeout(function () { b.classList.remove('spin'); }, 900);
    if (cur < 0) { location.reload(); return; }
    var f = open[cur]; if (!f) return openApp(cur);
    loading(true); f.src = 'about:blank'; setTimeout(function () { f.src = APPS[cur].url; }, 30);
  }

  $('grid').addEventListener('click', function (e) { var b = e.target.closest('.app'); if (b) openApp(+b.getAttribute('data-i')); });
  $('backBtn').onclick = showHome; $('refBtn').onclick = refresh; $('ref2Btn').onclick = refresh;

  /* ভাসমান বোতাম টেনে সরানো যায়; জায়গাটা মনে থাকে */
  var pill = $('pill'), PK = 'scs_suit_pill';
  var wco = function () { return !!(navigator.windowControlsOverlay && navigator.windowControlsOverlay.visible); };
  function placePill() {
    if (wco()) { pill.style.left = ''; pill.style.top = ''; pill.style.transform = ''; return; }
    var p = null; try { p = JSON.parse(localStorage.getItem(PK) || 'null'); } catch (e) {}
    if (!p) { pill.style.left = '50%'; pill.style.top = ''; pill.style.transform = 'translateX(-50%)'; return; }
    var w = pill.offsetWidth || 70, h = pill.offsetHeight || 28;
    pill.style.transform = 'none'; pill.style.left = Math.max(2, Math.min(innerWidth - w - 2, p.x * innerWidth)) + 'px'; pill.style.top = Math.max(2, Math.min(innerHeight - h - 2, p.y * innerHeight)) + 'px';
  }
  (function () {
    var g = $('grip'), sx, sy, ox, oy, drag = false;
    g.addEventListener('pointerdown', function (e) { if (wco()) return; drag = true; var r = pill.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; try { g.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault(); });
    g.addEventListener('pointermove', function (e) { if (!drag) return; pill.style.transform = 'none'; pill.style.left = Math.max(2, Math.min(innerWidth - pill.offsetWidth - 2, ox + e.clientX - sx)) + 'px'; pill.style.top = Math.max(2, Math.min(innerHeight - pill.offsetHeight - 2, oy + e.clientY - sy)) + 'px'; });
    g.addEventListener('pointerup', function () { if (!drag) return; drag = false; var r = pill.getBoundingClientRect(); try { localStorage.setItem(PK, JSON.stringify({ x: r.left / innerWidth, y: r.top / innerHeight })); } catch (e) {} });
    g.addEventListener('dblclick', function () { try { localStorage.removeItem(PK); } catch (e) {} placePill(); });
    window.addEventListener('resize', function () { if (cur >= 0) placePill(); });
    if (navigator.windowControlsOverlay) navigator.windowControlsOverlay.addEventListener('geometrychange', function () { if (cur >= 0) placePill(); });
  })();
  document.addEventListener('keydown', function (e) { if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r')) { e.preventDefault(); refresh(); } });

  /* ইন্টারনেট */
  var net = function () { $('off').classList.toggle('hide', navigator.onLine); };
  window.addEventListener('online', net); window.addEventListener('offline', net); net();

  /* ইনস্টল (Android / Desktop / Mac Chrome-Edge) */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var dp = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; $('ins').classList.remove('hide'); });
  $('ins').onclick = function () { if (!dp) return; dp.prompt(); dp.userChoice.finally(function () { dp = null; $('ins').classList.add('hide'); }); };
  window.addEventListener('appinstalled', function () { $('ins').classList.add('hide'); });
  /* iPhone / iPad: Add to Home Screen নির্দেশনা (একবার) */
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  try { if (ios && !standalone && !localStorage.getItem('scs_suit_ios')) { $('ios').classList.remove('hide'); localStorage.setItem('scs_suit_ios', '1'); } } catch (e) {}
  $('iosX').onclick = function () { $('ios').classList.add('hide'); };

  drawGrid();
  var h = parseInt((location.hash || '').slice(1), 10);
  if (h >= 0 && APPS[h]) openApp(h);
})();
</script>
</body>
</html>
